<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Coffee Shop – Submit Score</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;background:#1C0F08;font-family:'DM Sans',sans-serif;color:#F5ECD7;}
body{display:flex;align-items:center;justify-content:center;padding:2rem 1.2rem;}
.card{width:100%;max-width:420px;background:rgba(255,255,255,0.05);border:1px solid rgba(201,125,46,0.3);border-radius:20px;padding:2.2rem 2rem;}
.cup{font-size:3.5rem;text-align:center;display:block;margin-bottom:0.5rem;}
h1{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;text-align:center;color:#F5ECD7;margin-bottom:0.3rem;}
.sub{text-align:center;font-size:0.88rem;color:rgba(245,236,215,0.5);margin-bottom:2rem;}
label{display:block;font-size:0.75rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#C97D2E;margin-bottom:0.4rem;}
input{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(201,125,46,0.3);border-radius:10px;padding:0.85rem 1rem;font-size:1.05rem;color:#F5ECD7;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s;margin-bottom:1.2rem;-webkit-appearance:none;}
input:focus{border-color:rgba(201,125,46,0.7);}
input::placeholder{color:rgba(245,236,215,0.25);}
.row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.btn{width:100%;background:#C97D2E;color:#1C0F08;border:none;border-radius:10px;padding:0.95rem;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:0.4rem;}
.btn:hover{background:#E8A838;}
.btn:disabled{opacity:0.45;cursor:default;}
.msg{text-align:center;border-radius:10px;padding:1rem;margin-top:1rem;font-size:0.92rem;display:none;}
.msg.ok{background:rgba(45,106,45,0.25);border:1px solid rgba(45,106,45,0.5);color:#90cc60;}
.msg.err{background:rgba(176,48,48,0.25);border:1px solid rgba(176,48,48,0.5);color:#ff9a9a;}
.success-view{display:none;text-align:center;}
.trophy{font-size:4rem;margin-bottom:1rem;display:block;}
.score-big{font-family:'Playfair Display',serif;font-size:2.8rem;color:#C97D2E;margin:0.5rem 0;}
.score-lbl{font-size:0.85rem;color:rgba(245,236,215,0.5);}
.rank-badge{display:inline-block;background:rgba(201,125,46,0.15);border:1px solid rgba(201,125,46,0.3);border-radius:20px;padding:0.3rem 1rem;font-size:0.82rem;color:#C97D2E;margin-top:0.6rem;}
.again-btn{background:transparent;border:1px solid rgba(201,125,46,0.35);color:#C97D2E;border-radius:8px;padding:0.6rem 1.4rem;font-family:'DM Sans',sans-serif;font-size:0.85rem;cursor:pointer;margin-top:1.2rem;}
</style>
</head>
<body>
<div class="card">
  <div id="form-view">
    <span class="cup">☕</span>
    <h1>Submit Your Score</h1>
    <p class="sub">Café Calypso — 14 Day Challenge</p>
    <label>Your name</label>
    <input type="text" id="nameInput" placeholder="e.g. Alex" maxlength="30" autocomplete="off"/>
    <div class="row">
      <div>
        <label>Profits ($)</label>
        <input type="number" id="profitsInput" placeholder="e.g. 42.50" min="0" max="9999" step="0.01"/>
      </div>
      <div>
        <label>Days completed</label>
        <input type="number" id="daysInput" placeholder="e.g. 5" min="1" max="14" step="1"/>
      </div>
    </div>
    <label>Reputation <span style="color:rgba(245,236,215,0.4);font-size:0.72rem;text-transform:none;letter-spacing:0">(bottom-left in game)</span></label>
    <input type="number" id="repInput" placeholder="e.g. 85" min="0" max="100" step="1"/>
    <button class="btn" id="submitBtn" onclick="submitScore()">Submit to Leaderboard ☕</button>
    <div class="msg" id="msg"></div>
  </div>
  <div class="success-view" id="success-view">
    <span class="trophy">🏆</span>
    <p style="color:rgba(245,236,215,0.6);font-size:0.9rem;">Your score is on the board!</p>
    <div class="score-big" id="disp-profits">$0</div>
    <div class="score-lbl">Final profits</div>
    <div class="rank-badge" id="disp-rank">Submitted!</div>
    <br>
    <button class="again-btn" onclick="resetForm()">Update my score</button>
  </div>
</div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbx8RrnwvM1xubuiT1FRjpayhRZ1McBP5Hmugkkni3FKjzx7_z5ZqWreoc3OkcesmVHMnA/exec';
function showMsg(t,c){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+c;e.style.display='block';}
async function submitScore(){
  const name=document.getElementById('nameInput').value.trim();
  const profits=parseFloat(document.getElementById('profitsInput').value);
  const days=parseInt(document.getElementById('daysInput').value);
  const rep=parseInt(document.getElementById('repInput').value);
  if(!name){showMsg('Please enter your name.','err');return;}
  if(isNaN(profits)||profits<0){showMsg('Please enter a valid profits amount.','err');return;}
  if(isNaN(days)||days<1||days>14){showMsg('Days must be between 1 and 14.','err');return;}
  const btn=document.getElementById('submitBtn');
  btn.disabled=true;btn.textContent='Submitting…';
  try{
    await fetch(API,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,profits,days,reputation:isNaN(rep)?0:rep})});
    document.getElementById('form-view').style.display='none';
    document.getElementById('success-view').style.display='block';
    document.getElementById('disp-profits').textContent='$'+profits.toFixed(2);
    try{
      const lb=await fetch(API+'?t='+Date.now());
      if(lb.ok){const board=await lb.json();const rank=board.findIndex(e=>e.name.toLowerCase()===name.toLowerCase())+1;if(rank>0)document.getElementById('disp-rank').textContent='Rank #'+rank+' of '+board.length;}
    }catch(e){}
  }catch(err){showMsg('Could not connect. Check your internet and try again.','err');btn.disabled=false;btn.textContent='Submit to Leaderboard ☕';}
}
function resetForm(){
  document.getElementById('form-view').style.display='block';
  document.getElementById('success-view').style.display='none';
  document.getElementById('submitBtn').disabled=false;
  document.getElementById('submitBtn').textContent='Submit to Leaderboard ☕';
  document.getElementById('msg').style.display='none';
}
</script>
</body>
</html>
